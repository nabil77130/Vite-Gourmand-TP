# Le port d'ecoute est remplace au demarrage par celui fourni par Render ($PORT).
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toute adresse qui ne correspond pas a un fichier existant est
        # traitee par le controleur frontal de Symfony.
        FallbackResource /index.php
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
