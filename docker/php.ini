; Reglages PHP de production
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
; Galerie : photos de 2 Mo maximum, jusqu'a 10 par envoi
upload_max_filesize = 2M
post_max_size = 25M
max_file_uploads = 10
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
realpath_cache_size = 4096K
realpath_cache_ttl = 600
